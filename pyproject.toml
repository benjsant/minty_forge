[project]
name = "mintyforge"
version = "0.1.0"
description = "Post-install automation tool for Linux Mint"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "pydantic>=2.0.0",
]

[tool.uv]
# uv cree automatiquement .venv/ a la racine du projet
# Lancer : uv sync
# Executer : uv run python minty_forge.py
